<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE Talks | UCSC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <style>
        :root { --ucsc-blue: #003c6c; --ucsc-gold: #f1b521; }
        body { background-color: #fff; padding: 20px; font-family: -apple-system, sans-serif; }
        
        .filter-section { background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 30px; }
        .filter-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: #555; }
        
        .tec-event-list-item { 
            display: flex; 
            align-items: stretch; 
            border: 1px solid #ddd; 
            border-radius: 8px;
            margin-bottom: 25px; 
            overflow: hidden;
            background: #fff;
        }

        .tec-event-content { 
            flex: 1; 
            padding: 25px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .tec-event-image-wrapper { 
            width: 250px; 
            flex-shrink: 0; 
            background: #f0f0f0; 
        }

        .tec-event-image { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
        }

        .btn-google { background: #4285F4; color: white; border: none; font-weight: 600; }
        
        /* RESTORED PREVIEW LIMIT */
        .description-container { 
            font-size: 0.95rem; 
            margin-top: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 3; /* Limits to exactly 3 lines */
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 style="color: var(--ucsc-blue); font-weight: 800;">CSE Talks</h1>

    <div class="filter-section">
        <form id="filter-form" class="row g-3">
            <div class="col-md-7">
                <label class="filter-label">Search CSE Events</label>
                <input type="text" id="search" class="form-control" placeholder="Keywords...">
            </div>
            <div class="col-md-5 d-flex align-items-end gap-2">
                <button type="submit" class="btn btn-primary flex-grow-1" style="background: var(--ucsc-blue);">Filter</button>
                <button type="button" id="google-subscribe-btn" class="btn btn-google">Add to Google Calendar</button>
                <button type="button" id="copy-link-btn" class="btn btn-outline-secondary" title="Copy iCal Link">🔗</button>
            </div>
        </form>
    </div>

    <div id="events-list"></div>
</div>

<script>
    const API_BASE = "https://events.ucsc.edu/wp-json/tribe/events/v1";
    const CSE_ORGANIZER_ID = "409";

    const urlParams = new URLSearchParams(window.location.search);
    const state = {
        search: urlParams.get('search') || "",
        organizer: urlParams.get('organizer') || CSE_ORGANIZER_ID,
    };

    function getFilteredIcsPath() {
        const search = document.getElementById('search').value;
        const url = "events.ucsc.edu/events/";
        const params = new URLSearchParams({ ical: "1", organizer: CSE_ORGANIZER_ID });
        if (search) params.append('tribe-bar-search', search);
        // params.append('name', "CSE Talks"); // doesn't seem to work
        return `${url}?${params.toString()}`;
    }

    document.getElementById('google-subscribe-btn').onclick = () => {
        const rawUrl = getFilteredIcsPath();
        const googleUrl = `https://www.google.com/calendar/render?cid=${encodeURIComponent('webcal://' + rawUrl)}`;
        window.open(googleUrl, '_blank');
    };

    document.getElementById('copy-link-btn').onclick = async () => {
        const url = "webcal://" + getFilteredIcsPath();
        await navigator.clipboard.writeText(url);
        alert("CSE iCal link copied!");
    };

    async function loadEvents() {
        const params = new URLSearchParams({ organizer: CSE_ORGANIZER_ID });
        const s = document.getElementById('search').value;
        if (s) params.append('search', s);

        try {
            const res = await fetch(`${API_BASE}/events?${params.toString()}`);
            const data = await res.json();
            const list = document.getElementById('events-list');
            
            list.innerHTML = data.events.map((ev, i) => `
                <div class="tec-event-list-item">
                    <div class="tec-event-content">
                        <div style="color:var(--ucsc-blue); font-weight:700;">${ev.start_date}</div>
                        <a href="${ev.url}" target="_blank" style="font-size:1.2rem; font-weight:bold; text-decoration:none; color:var(--ucsc-blue);">${ev.title}</a>
                        <div class="description-container">${DOMPurify.sanitize(ev.description)}</div>
                    </div>
                    ${ev.image ? `
                        <div class="tec-event-image-wrapper">
                            <img src="${ev.image.url}" class="tec-event-image" alt="Event Image">
                        </div>
                    ` : ''}
                </div>
            `).join('');
            const displayParams = new URLSearchParams(params);
            // displayParams.delete('organizer');
            window.history.replaceState({}, '', `${window.location.pathname}?${displayParams.toString()}`);
        } catch (error) {
            console.error("Error loading events:", error);
        }
    }

    document.getElementById('filter-form').onsubmit = (e) => { e.preventDefault(); loadEvents(); };
    document.getElementById('search').value = state.search;
    loadEvents();
</script>
</body>
</html>
